name: kilifihub_rider
description: KilifiHub Rider App - Food delivery rider companion app with background GPS tracking and push notifications.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # HTTP & API
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Authentication & Storage
  shared_preferences: ^2.2.2

  # Location
  geolocator: ^10.1.0

  # Background Services
  flutter_background_service: ^4.0.0

  # Local Notifications (works without Firebase)
  flutter_local_notifications: ^16.3.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0
  flutter_spinkit: ^5.2.0
  connectivity_plus: ^5.0.2

  # Firebase - ADD THESE BACK AFTER SETTING UP FIREBASE
  # See DEPLOYMENT_GUIDE.md Step 1 for Firebase setup instructions
  # firebase_core: ^2.24.0
  # firebase_messaging: ^14.7.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

            Widget _buildDemoOrderCard(Map<String, dynamic> order) {
              final status = order['status'] as String? ?? '';
              final vendor = order['vendor'] as Map<String, dynamic>? ?? {};
              final customer = order['customer'] as Map<String, dynamic>? ?? {};
              final items = order['items'] as List<dynamic>? ?? [];
              final delivery = order['delivery'] as Map<String, dynamic>? ?? {};

              Color statusColor;
              String statusLabel;
              switch (status) {
                case 'courier-assignment':
                  statusColor = Color(AppConfig.ACCENT_COLOR);
                  statusLabel = 'New Order';
                  break;
                case 'rider-accepted':
                  statusColor = Color(0xFF2196F3);
                  statusLabel = 'Accepted';
                  break;
                case 'rider-picked-up':
                  statusColor = Color(AppConfig.PRIMARY_COLOR);
                  statusLabel = 'Picked Up';

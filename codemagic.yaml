              old_main = "void main() async {\n  WidgetsFlutterBinding.ensureInitialized();"
              new_main = (
                  "void main() async {\n"
                  "  WidgetsFlutterBinding.ensureInitialized();\n\n"
                  "  // Check if we were previously in guest/demo mode\n"
                  "  await DemoMode.checkGuestMode();\n"
                  "  if (!DemoMode.isGuest) {\n"
                  "    // Try server reachability - if server is down, enable demo mode\n"
                  "    final reachable = await DemoMode.isServerReachable();\n"
                  "    if (!reachable) {\n"
                  "      await DemoMode.enableGuestMode();\n"
                  "    }\n"
                  "  }"
              )
              content = content.replace(old_main, new_main)
              print("Added DemoMode check to main()")

          # Wrap Firebase init in a try-catch that falls back to demo mode
          old_firebase = "  // Initialize Firebase\n  await Firebase.initializeApp(\n    options: DefaultFirebaseOptions.currentPlatform,\n  );"
          new_firebase = (
              "  // Initialize Firebase (skip in guest mode)\n"
              "  if (!DemoMode.isGuest) {\n"
              "    try {\n"
              "      await Firebase.initializeApp(\n"
              "        options: DefaultFirebaseOptions.currentPlatform,\n"
              "      );\n"
              "    } catch (e) {\n"
              "      debugPrint('Firebase init failed, enabling demo mode: ' + e.toString());\n"
              "      await DemoMode.enableGuestMode();\n"
              "    }\n"
              "  }"
          )
          if "DemoMode.isGuest) {" not in content and "Firebase.initializeApp" in content:
              content = content.replace(old_firebase, new_firebase)
              print("Wrapped Firebase init in demo mode check")

          # Wrap other init calls in demo mode check
          old_loc_init = "  // Initialize background location service\n  await LocationService.initializeBackgroundService();"
          new_loc_init = "  // Initialize background location service (skip in guest mode)\n  if (!DemoMode.isGuest) {\n    await LocationService.initializeBackgroundService();\n  }"
          if "DemoMode.isGuest" not in content.split("LocationService")[0] if "LocationService" in content else "":
              content = content.replace(old_loc_init, new_loc_init)

          old_push_init = "  // Initialize push notifications (FCM)\n  await PushNotificationService.instance.initialize();"
          new_push_init = "  // Initialize push notifications (skip in guest mode)\n  if (!DemoMode.isGuest) {\n    await PushNotificationService.instance.initialize();\n  }"
          if "DemoMode.isGuest" not in content.split("PushNotificationService")[0] if "PushNotificationService" in content else "":
              content = content.replace(old_push_init, new_push_init)

          # Patch _checkSession in AuthWrapper to handle demo mode
          old_check = "  Future<void> _checkSession() async {\n    final auth = Provider.of<AuthService>(context, listen: false);\n    await auth.checkSession();\n    setState(() => _isChecking = false);\n  }"
          new_check = (
              "  Future<void> _checkSession() async {\n"
              "    if (DemoMode.isGuest) {\n"
              "      setState(() => _isChecking = false);\n"
              "      return;\n"
              "    }\n"
              "    try {\n"
              "      final auth = Provider.of<AuthService>(context, listen: false);\n"
              "      await auth.checkSession();\n"
              "    } catch (e) {\n"
              "      debugPrint('Session check failed: ' + e.toString());\n"
              "      await DemoMode.enableGuestMode();\n"
              "    }\n"
              "    setState(() => _isChecking = false);\n"
              "  }"
          )
          if "await DemoMode.checkGuestMode()" in content and "DemoMode.isGuest) {" not in content.split("_checkSession")[1] if "_checkSession" in content else "":
              content = content.replace(old_check, new_check)
              print("Patched _checkSession for demo mode")

          # Add GuestHomeScreen to AuthWrapper build
          old_build = "    return Consumer<AuthService>(\n      builder: (context, auth, _) {\n        if (auth.isLoggedIn) {\n          return const HomeScreen();\n        }\n        return const LoginScreen();\n      },\n    );"
          new_build = (
              "    if (DemoMode.isGuest) {\n"
              "      return const GuestHomeScreen();\n"
              "    }\n\n"
              "    return Consumer<AuthService>(\n"
              "      builder: (context, auth, _) {\n"
              "        if (auth.isLoggedIn) {\n"
              "          return const HomeScreen();\n"
              "        }\n"
              "        return const LoginScreen();\n"
              "      },\n"
              "    );"
          )
          if "GuestHomeScreen" not in content:
              content = content.replace(old_build, new_build)
              print("Added GuestHomeScreen to AuthWrapper")

          with open(main_path, 'w') as f:
              f.write(content)
          print("Patched main.dart for demo mode integration")
          print("=== Demo mode setup complete ===")
          PYEOF


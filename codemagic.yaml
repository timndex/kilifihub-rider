      - name: Patch main.dart and api_service.dart for demo mode
        script: |
          set -e
          echo "Patching main.dart and api_service.dart..."

          python3 << 'PYEOF'
          import os, re

          # ============================================================
          # PATCH: lib/main.dart
          # ============================================================
          main_file = "lib/main.dart"
          if os.path.exists(main_file):
              with open(main_file, 'r') as f:
                  content = f.read()

              # Add imports
              if "demo_mode.dart" not in content:
                  content = "import 'utils/demo_mode.dart';\n" + content
                  print("Added demo_mode import to main.dart")
              if "guest_home_screen.dart" not in content:
                  content = "import 'screens/guest_home_screen.dart';\n" + content
                  print("Added guest_home_screen import to main.dart")

              # Add dart:ui for PlatformDispatcher
              if "PlatformDispatcher" not in content and "dart:ui" not in content:
                  content = "import 'dart:ui';\n" + content
                  print("Added dart:ui import")

              # Make main() async if not already
              if "void main() async" not in content:
                  content = content.replace("void main() {", "void main() async {")
                  print("Made main() async")

              # Add WidgetsFlutterBinding.ensureInitialized() if not present
              if "WidgetsFlutterBinding.ensureInitialized()" not in content:
                  content = content.replace(
                      "void main() async {",
                      "void main() async {\n  WidgetsFlutterBinding.ensureInitialized();"
                  )
                  print("Added ensureInitialized")

              # Add global error handlers
              if "FlutterError.onError" not in content:
                  content = content.replace(
                      "WidgetsFlutterBinding.ensureInitialized();",
                      "WidgetsFlutterBinding.ensureInitialized();\n"
                      "  FlutterError.onError = (details) {\n"
                      "    debugPrint('FlutterError: ' + details.exceptionAsString());\n"
                      "  };\n"
                      "  PlatformDispatcher.instance.onError = (error, stack) {\n"
                      "    debugPrint('PlatformError: ' + error.toString());\n"
                      "    return true;\n"
                      "  };"
                  )
                  print("Added error handlers")

              # Comment out Firebase initialization
              if "await Firebase.initializeApp" in content and "// await Firebase.initializeApp" not in content:
                  content = content.replace("await Firebase.initializeApp", "// await Firebase.initializeApp")
                  print("Commented out Firebase.initializeApp")

              if "import 'firebase_options.dart'" in content and "// import 'firebase_options.dart'" not in content:
                  content = content.replace("import 'firebase_options.dart';", "// import 'firebase_options.dart';")
                  print("Commented out firebase_options import")

              # Comment out LocationService initialize
              if "await LocationService.initializeBackgroundService" in content and "// await LocationService.initializeBackgroundService" not in content:
                  content = content.replace("await LocationService.initializeBackgroundService", "// await LocationService.initializeBackgroundService")
                  print("Commented out LocationService.initializeBackgroundService")

              # Comment out PushNotificationService initialize
              if "await PushNotificationService.instance.initialize" in content and "// await PushNotificationService.instance.initialize" not in content:
                  content = content.replace("await PushNotificationService.instance.initialize", "// await PushNotificationService.instance.initialize")
                  print("Commented out PushNotificationService.instance.initialize")

              # Add demo mode check before runApp
              if "await DemoMode.checkGuestMode()" not in content:
                  content = content.replace(
                      "  runApp(const KilifiHubRiderApp());",
                      "  await DemoMode.checkGuestMode();\n"
                      "  if (!DemoMode.isGuest) {\n"
                      "    final reachable = await DemoMode.isServerReachable();\n"
                      "    if (!reachable) {\n"
                      "      await DemoMode.enableGuestMode();\n"
                      "    }\n"
                      "  }\n"
                      "  runApp(const KilifiHubRiderApp());"
                  )
                  print("Added demo mode check before runApp")

              # Patch _checkSession to handle demo mode
              old_check = "    final auth = Provider.of<AuthService>(context, listen: false);\n    await auth.checkSession();"
              new_check = "    if (DemoMode.isGuest) {\n      setState(() => _isChecking = false);\n      return;\n    }\n    try {\n      final auth = Provider.of<AuthService>(context, listen: false);\n      await auth.checkSession();\n    } catch (e) {\n      debugPrint('Session check failed: ' + e.toString());\n      await DemoMode.enableGuestMode();\n    }"
              if old_check in content:
                  content = content.replace(old_check, new_check)
                  print("Patched _checkSession")

              # Add GuestHomeScreen to AuthWrapper build
              if "DemoMode.isGuest" not in content.split("Widget build")[1] if "Widget build" in content else "":
                  old_build = "    return Consumer<AuthService>(\n      builder: (context, auth, _) {\n        if (auth.isLoggedIn) {\n          return const HomeScreen();\n        }\n        return const LoginScreen();\n      },\n    );"
                  new_build = "    if (DemoMode.isGuest) {\n      return const GuestHomeScreen();\n    }\n\n    return Consumer<AuthService>(\n      builder: (context, auth, _) {\n        if (auth.isLoggedIn) {\n          return const HomeScreen();\n        }\n        return const LoginScreen();\n      },\n    );"
                  if old_build in content:
                      content = content.replace(old_build, new_build)
                      print("Added GuestHomeScreen to AuthWrapper")

              with open(main_file, 'w') as f:
                  f.write(content)
              print("Patched main.dart successfully")
          else:
              print("main.dart not found!")

          # ============================================================
          # PATCH: lib/services/api_service.dart
          # Fix connectivity_plus v6+ returning List<ConnectivityResult>
          # ============================================================
          api_file = "lib/services/api_service.dart"
          if os.path.exists(api_file):
              with open(api_file, 'r') as f:
                  api_content = f.read()

              if ".contains(ConnectivityResult.none)" in api_content:
                  api_content = re.sub(
                      r'(\w+)\.contains\(ConnectivityResult\.none\)',
                      r'\1.any((r) => r == ConnectivityResult.none)',
                      api_content
                  )
                  print("Fixed connectivity .contains() -> .any() in api_service.dart")

              with open(api_file, 'w') as f:
                  f.write(api_content)
              print("Patched api_service.dart")
          else:
              print("api_service.dart not found!")

          print("=== All patches complete ===")
          PYEOF

      - name: Re-get packages after all patches
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --debug --android-skip-build-dependency-validation

    artifacts:
      - build/**/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

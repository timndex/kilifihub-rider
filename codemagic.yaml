workflows:
  android-apk:
    name: KilifiHub Rider Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Create fresh Flutter project and copy our code
        script: |
          flutter create --org com.kilifihub --project-name kilifihub_rider /tmp/fresh_project
          cp -r lib/ /tmp/fresh_project/lib/
          cp pubspec.yaml /tmp/fresh_project/pubspec.yaml
          if [ -d "assets" ]; then
            cp -r assets/ /tmp/fresh_project/assets/
          fi

          # Write AndroidManifest.xml with our permissions
          cat > /tmp/fresh_project/android/app/src/main/AndroidManifest.xml << 'MANIFESTEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:label="KilifiHub Rider"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          MANIFESTEOF

          rm -rf /Users/builder/clone/*
          cp -r /tmp/fresh_project/* /Users/builder/clone/
          cp -r /tmp/fresh_project/.* /Users/builder/clone/ 2>/dev/null || true
          echo "=== Fresh project copied ==="

      - name: Get Flutter packages
        script: flutter pub get

      - name: Patch Gradle files and cached plugins for our requirements
        script: |
          echo "=== Patching Gradle files using Python (Kotlin DSL aware) ==="

          python3 << 'PYEOF'
          import os, glob, re

          def is_kts(filepath):
              return filepath.endswith('.kts')

          for gradle_file in glob.glob("android/app/build.gradle*"):
              kts = is_kts(gradle_file)
              print(f"Patching {gradle_file} (Kotlin DSL={kts})...")

              with open(gradle_file, 'r') as f:
                  content = f.read()

              if kts:
                  content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', content)
                  content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', content)
                  content = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 36', content)
                  content = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 36', content)
              else:
                  content = re.sub(r'compileSdk\s+flutter\.compileSdkVersion', 'compileSdk 36', content)
                  content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', content)
                  content = re.sub(r'targetSdk\s+flutter\.targetSdkVersion', 'targetSdk 36', content)
                  content = re.sub(r'targetSdk\s+\d+', 'targetSdk 36', content)

              if 'isCoreLibraryDesugaringEnabled' not in content and 'coreLibraryDesugaringEnabled' not in content:
                  if kts:
                      content = content.replace('sourceCompatibility', 'isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility')
                  else:
                      content = content.replace('sourceCompatibility', 'coreLibraryDesugaringEnabled = true\n        sourceCompatibility')

              if 'desugar_jdk_libs' not in content:
                  if 'dependencies {' in content:
                      content = content.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")')
                  else:
                      if kts:
                          content = content.rstrip() + '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                      else:
                          content = content.rstrip() + '\n\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'

              if 'shrinkResources' not in content:
                  if kts:
                      content = content.replace('minifyEnabled = false', 'minifyEnabled = false\n            shrinkResources = false')
                  else:
                      content = content.replace('minifyEnabled false', 'minifyEnabled false\n            shrinkResources false')

              content = content.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
              content = content.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
              if 'kotlinOptions' not in content and 'compileOptions' in content:
                  content = content.replace(
                      'targetCompatibility = JavaVersion.VERSION_17\n            }',
                      'targetCompatibility = JavaVersion.VERSION_17\n        }\n\n        kotlinOptions {\n            jvmTarget = "17"\n        }'
                  )

              with open(gradle_file, 'w') as f:
                  f.write(content)

              assert 'compileSdk = 36' in content or 'compileSdk 36' in content
              assert 'desugar_jdk_libs' in content
              print("VERIFICATION: Gradle patches confirmed!")

          pub_cache = os.path.expanduser("~/.pub-cache")
          patched_count = 0
          for root, dirs, files in os.walk(pub_cache):
              for fname in files:
                  if fname == "build.gradle":
                      fpath = os.path.join(root, fname)
                      try:
                          with open(fpath, 'r') as f:
                              plugin_content = f.read()
                          changed = False
                          new_content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', plugin_content)
                          if new_content != plugin_content:
                              plugin_content = new_content
                              changed = True
                          new_content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', plugin_content)
                          if new_content != plugin_content:
                              plugin_content = new_content
                              changed = True
                          if 'namespace' not in plugin_content:
                              manifest_dir = os.path.join(os.path.dirname(fpath), 'src', 'main')
                              manifest_path = os.path.join(manifest_dir, 'AndroidManifest.xml')
                              if not os.path.exists(manifest_path):
                                  for search_root, _, search_files in os.walk(os.path.dirname(fpath)):
                                      if 'AndroidManifest.xml' in search_files:
                                          manifest_path = os.path.join(search_root, 'AndroidManifest.xml')
                                          break
                              if os.path.exists(manifest_path):
                                  with open(manifest_path, 'r') as mf:
                                      manifest_content = mf.read()
                                  pkg_match = re.search(r'package="([^"]+)"', manifest_content)
                                  if pkg_match:
                                      package_name = pkg_match.group(1)
                                      plugin_content = plugin_content.replace('android {', f"android {{\n    namespace '{package_name}'")
                                      changed = True
                          if changed:
                              with open(fpath, 'w') as f:
                                  f.write(plugin_content)
                              patched_count += 1
                      except Exception as e:
                          print(f"Error patching {fpath}: {e}")

          print(f"Patched {patched_count} plugin build files")
          PYEOF

      - name: Fix missing namespaces in cached plugins (shell fallback)
        script: |
          echo "Fixing missing namespaces in cached plugins..."
          for BUILD_FILE in $(find ~/.pub-cache -name "build.gradle" -path "*/android/build.gradle"); do
            if ! grep -q "namespace" "$BUILD_FILE"; then
              MANIFEST=$(find "$(dirname "$BUILD_FILE")" -name "AndroidManifest.xml" | head -1)
              if [ -f "$MANIFEST" ]; then
                PACKAGE=$(grep -o 'package="[^"]*"' "$MANIFEST" | head -1 | sed 's/package="//;s/"//')
                if [ -n "$PACKAGE" ]; then
                  echo "Adding namespace '$PACKAGE' to $BUILD_FILE"
                  sed -i '' "s/^android {/android {\n    namespace '$PACKAGE'/" "$BUILD_FILE"
                fi
              fi
            fi
          done
          echo "=== Namespace fix complete ==="

      - name: Fix all Dart code issues and pubspec
        script: |
          echo "Fixing Dart code issues and pubspec..."

          PUBSPEC_FILE="pubspec.yaml"
          if [ -f "$PUBSPEC_FILE" ]; then
            sed -i '' 's/flutter_background_service: \^4.0.0/flutter_background_service: ^5.0.0/' "$PUBSPEC_FILE"
            sed -i '' 's/flutter_background_service: \^3.0.1/flutter_background_service: ^5.0.0/' "$PUBSPEC_FILE"
            sed -i '' 's/flutter_local_notifications: \^16.3.0/flutter_local_notifications: ^18.0.0/' "$PUBSPEC_FILE"
            echo "Fixed pubspec.yaml"
          fi

          MAIN_FILE="lib/main.dart"
          if [ -f "$MAIN_FILE" ]; then
            sed -i '' "/import.*firebase_core/d" "$MAIN_FILE"
            sed -i '' 's/^\(\s*\)await Firebase.initializeApp();/\1\/\/ await Firebase.initializeApp();/' "$MAIN_FILE"
            sed -i '' 's/CardTheme(/CardThemeData(/' "$MAIN_FILE"
            echo "Fixed main.dart"
          fi

          PUSH_FILE="lib/services/push_notification_service.dart"
          if [ -f "$PUSH_FILE" ]; then
            sed -i '' 's/const AndroidNotificationDetails androidDetails/AndroidNotificationDetails androidDetails/' "$PUSH_FILE"
            sed -i '' 's/const NotificationDetails details/NotificationDetails details/' "$PUSH_FILE"
            sed -i '' '/import.*firebase_core/d' "$PUSH_FILE"
            sed -i '' '/import.*firebase_messaging/d' "$PUSH_FILE"
            sed -i '' '/RemoteMessage/d' "$PUSH_FILE"
            sed -i '' '/Firebase.initializeApp/d' "$PUSH_FILE"
            sed -i '' '/FirebaseMessaging/d' "$PUSH_FILE"
            echo "Fixed push_notification_service.dart"
          fi

          API_FILE="lib/services/api_service.dart"
          if [ -f "$API_FILE" ]; then
            sed -i '' 's/StorageService()/StorageService.instance/' "$API_FILE"
            echo "Fixed api_service.dart"
          fi

          API_CFG="lib/config/api_config.dart"
          if [ -f "$API_CFG" ]; then
            sed -i '' 's/static const double GPS_DISTANCE_FILTER_METERS = 5.0;/static const int GPS_DISTANCE_FILTER_METERS = 5;/' "$API_CFG"
            echo "Fixed api_config.dart"
          fi

          LOC_FILE="lib/services/location_service.dart"
          if [ -f "$LOC_FILE" ]; then
            sed -i '' 's/ApiConfig.GPS_DISTANCE_FILTER_METERS.toInt()/ApiConfig.GPS_DISTANCE_FILTER_METERS/g' "$LOC_FILE"
            sed -i '' 's/locationSettings: const LocationSettings(/desiredAccuracy: LocationAccuracy.high,/' "$LOC_FILE"
            sed -i '' '/accuracy: LocationAccuracy.high,$/d' "$LOC_FILE"
            sed -i '' '/timeLimit: Duration(seconds: 10),$/s//timeLimit: Duration(seconds: 10),/' "$LOC_FILE"
            sed -i '' 's/        ),$/      );/' "$LOC_FILE"
            echo "Fixed location_service.dart"
          fi

          echo "=== All Dart fixes complete ==="

      - name: Re-get packages after pubspec fix
        script: flutter pub get


          class DemoMode {
            static const String _keyIsGuest = 'rider_is_guest_mode';
            static const String _keyUserToken = 'auth_token';
            static const String _keyUserId = 'rider_id';
            static const String _keyUserName = 'rider_name';
            static const String _keyUserPhone = 'rider_phone';

            static bool _isGuest = false;
            static bool get isGuest => _isGuest;

            static Future<void> enableGuestMode() async {
              _isGuest = true;
              final prefs = await SharedPreferences.getInstance();
              await prefs.setBool(_keyIsGuest, true);
              await prefs.setString(_keyUserToken, 'demo_rider_token_99999');
              await prefs.setInt(_keyUserId, 99);
              await prefs.setString(_keyUserName, 'Demo Rider');
              await prefs.setString(_keyUserPhone, '0712345678');
            }

            static Future<void> disableGuestMode() async {
              _isGuest = false;
              final prefs = await SharedPreferences.getInstance();
              await prefs.remove(_keyIsGuest);
              await prefs.remove(_keyUserToken);
              await prefs.remove(_keyUserId);
              await prefs.remove(_keyUserName);
              await prefs.remove(_keyUserPhone);
            }

            static Future<bool> checkGuestMode() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                _isGuest = prefs.getBool(_keyIsGuest) ?? false;
              } catch (e) {
                _isGuest = false;
              }
              return _isGuest;
            }

            static Future<bool> isServerReachable() async {
              try {
                final socket = await Socket.connect('ats.unaux.com', 443, timeout: Duration(seconds: 3));
                socket.destroy();
                return true;
              } catch (e) {
                try {
                  final socket = await Socket.connect('ats.unaux.com', 80, timeout: Duration(seconds: 3));
                  socket.destroy();
                  return true;
                } catch (e2) {
                  return false;
                }
              }
            }

            static Future<String?> getToken() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                return prefs.getString(_keyUserToken);
              } catch (e) { return null; }
            }

            static Future<int?> getUserId() async {
              try {
                final prefs = await SharedPreferences.getInstance();
                return prefs.getInt(_keyUserId);
              } catch (e) { return null; }
            }


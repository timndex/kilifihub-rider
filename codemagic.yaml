workflows:
  android-apk:
    name: KilifiHub Rider Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Create fresh Flutter project and copy our code
        script: |
          flutter create --org com.kilifihub --project-name kilifihub_rider /tmp/fresh_project
          cp -r lib/ /tmp/fresh_project/lib/
          cp pubspec.yaml /tmp/fresh_project/pubspec.yaml
          if [ -d "assets" ]; then
            cp -r assets/ /tmp/fresh_project/assets/
          fi

          # Write AndroidManifest.xml with our permissions
          cat > /tmp/fresh_project/android/app/src/main/AndroidManifest.xml << 'MANIFESTEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:label="KilifiHub Rider"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          MANIFESTEOF

          rm -rf /Users/builder/clone/*
          cp -r /tmp/fresh_project/* /Users/builder/clone/
          cp -r /tmp/fresh_project/.* /Users/builder/clone/ 2>/dev/null || true

          # Downgrade Gradle wrapper to 8.11.1
          # Flutter stable (3.44.0) ships Gradle 9.x which is incompatible with current AGP
          GRADLE_PROPS="/Users/builder/clone/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROPS" ]; then
            sed -i '' 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-8.11.1-all.zip|' "$GRADLE_PROPS"
            echo "Downgraded Gradle wrapper to 8.11.1"
            cat "$GRADLE_PROPS"
          fi

          echo "=== Fresh project ready ==="

      - name: Get Flutter packages
        script: flutter pub get

      - name: Fix missing namespaces in cached plugins
        script: |
          echo "Fixing missing namespaces in cached plugins..."
          for BUILD_FILE in $(find ~/.pub-cache -name "build.gradle" -path "*/android/build.gradle"); do
            if ! grep -q "namespace" "$BUILD_FILE"; then
              MANIFEST=$(find "$(dirname "$BUILD_FILE")" -name "AndroidManifest.xml" | head -1)
              if [ -f "$MANIFEST" ]; then
                PACKAGE=$(grep -o 'package="[^"]*"' "$MANIFEST" | head -1 | sed 's/package="//;s/"//')
                if [ -n "$PACKAGE" ]; then
                  echo "Adding namespace '$PACKAGE' to $BUILD_FILE"
                  sed -i '' "s/^android {/android {\n    namespace '$PACKAGE'/" "$BUILD_FILE"
                fi
              fi
            fi
          done
          echo "=== Namespace fix complete ==="

      - name: Fix all Dart code issues and pubspec
        script: |
          echo "Fixing Dart code issues and pubspec..."

          PUBSPEC_FILE="pubspec.yaml"
          if [ -f "$PUBSPEC_FILE" ]; then
            sed -i '' 's/flutter_background_service: \^4.0.0/flutter_background_service: ^5.0.0/' "$PUBSPEC_FILE"
            sed -i '' 's/flutter_background_service: \^3.0.1/flutter_background_service: ^5.0.0/' "$PUBSPEC_FILE"
            sed -i '' 's/flutter_local_notifications: \^16.3.0/flutter_local_notifications: ^18.0.0/' "$PUBSPEC_FILE"
            echo "Fixed pubspec.yaml"
          fi

          MAIN_FILE="lib/main.dart"
          if [ -f "$MAIN_FILE" ]; then
            sed -i '' "/import.*firebase_core/d" "$MAIN_FILE"
            sed -i '' 's/^\(\s*\)await Firebase.initializeApp();/\1\/\/ await Firebase.initializeApp();/' "$MAIN_FILE"
            sed -i '' 's/CardTheme(/CardThemeData(/' "$MAIN_FILE"
            echo "Fixed main.dart"
          fi

          PUSH_FILE="lib/services/push_notification_service.dart"
          if [ -f "$PUSH_FILE" ]; then
            sed -i '' 's/const AndroidNotificationDetails androidDetails/AndroidNotificationDetails androidDetails/' "$PUSH_FILE"
            sed -i '' 's/const NotificationDetails details/NotificationDetails details/' "$PUSH_FILE"
            sed -i '' '/import.*firebase_core/d' "$PUSH_FILE"
            sed -i '' '/import.*firebase_messaging/d' "$PUSH_FILE"
            sed -i '' '/RemoteMessage/d' "$PUSH_FILE"
            sed -i '' '/Firebase.initializeApp/d' "$PUSH_FILE"
            sed -i '' '/FirebaseMessaging/d' "$PUSH_FILE"
            echo "Fixed push_notification_service.dart"
          fi

          API_FILE="lib/services/api_service.dart"
          if [ -f "$API_FILE" ]; then
            sed -i '' 's/StorageService()/StorageService.instance/' "$API_FILE"
            echo "Fixed api_service.dart"
          fi

          API_CFG="lib/config/api_config.dart"
          if [ -f "$API_CFG" ]; then
            sed -i '' 's/static const double GPS_DISTANCE_FILTER_METERS = 5.0;/static const int GPS_DISTANCE_FILTER_METERS = 5;/' "$API_CFG"
            echo "Fixed api_config.dart"
          fi

          LOC_FILE="lib/services/location_service.dart"
          if [ -f "$LOC_FILE" ]; then
            sed -i '' 's/ApiConfig.GPS_DISTANCE_FILTER_METERS.toInt()/ApiConfig.GPS_DISTANCE_FILTER_METERS/g' "$LOC_FILE"
            sed -i '' 's/locationSettings: const LocationSettings(/desiredAccuracy: LocationAccuracy.high,/' "$LOC_FILE"
            sed -i '' '/accuracy: LocationAccuracy.high,$/d' "$LOC_FILE"
            sed -i '' '/timeLimit: Duration(seconds: 10),$/s//timeLimit: Duration(seconds: 10),/' "$LOC_FILE"
            sed -i '' 's/        ),$/      );/' "$LOC_FILE"
            echo "Fixed location_service.dart"
          fi

          echo "=== All fixes complete ==="

      - name: Re-get packages after pubspec fix
        script: flutter pub get

      - name: Patch build files for desugaring and compileSdk
        script: |
          echo "Patching build files using Python..."

          python3 << 'PYEOF'
          import os, glob, re

          def is_kts(filepath):
              """Check if a Gradle file uses Kotlin DSL (.kts)"""
              return filepath.endswith('.kts')

          # 1. Patch app-level build.gradle or build.gradle.kts
          for gradle_file in glob.glob("android/app/build.gradle*"):
              kts = is_kts(gradle_file)
              print(f"Patching {gradle_file} (Kotlin DSL={kts}) for desugaring and compileSdk...")
              with open(gradle_file, 'r') as f:
                  content = f.read()

              # --- Fix compileSdk ---
              if kts:
                  # Kotlin DSL: compileSdk = 36 or compileSdk = flutter.compileSdkVersion
                  content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', content)
                  content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', content)
                  # Also fix targetSdk
                  content = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 36', content)
                  content = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 36', content)
              else:
                  # Groovy DSL: compileSdk 34 or compileSdk flutter.compileSdkVersion
                  content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', content)
                  content = re.sub(r'compileSdk\s+flutter\.compileSdkVersion', 'compileSdk 36', content)
                  content = re.sub(r'targetSdk\s+\d+', 'targetSdk 36', content)
                  content = re.sub(r'targetSdk\s+flutter\.targetSdkVersion', 'targetSdk 36', content)

              # --- Add coreLibraryDesugaringEnabled ---
              if 'coreLibraryDesugaringEnabled' not in content and 'isCoreLibraryDesugaringEnabled' not in content:
                  if kts:
                      # Kotlin DSL: isCoreLibraryDesugaringEnabled = true
                      content = content.replace(
                          'sourceCompatibility',
                          'isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility'
                      )
                  else:
                      # Groovy DSL: coreLibraryDesugaringEnabled = true
                      content = content.replace(
                          'sourceCompatibility',
                          'coreLibraryDesugaringEnabled = true\n        sourceCompatibility'
                      )

              # --- Add desugaring dependency ---
              if 'desugar_jdk_libs' not in content:
                  if 'dependencies {' in content:
                      content = content.replace(
                          'dependencies {',
                          'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                      )

              with open(gradle_file, 'w') as f:
                  f.write(content)
              print(f"Patched {gradle_file}")

          # 2. Patch ROOT build.gradle or build.gradle.kts
          # Remove any broken subprojects block with Groovy syntax in .kts files
          for gradle_file in glob.glob("android/build.gradle*"):
              print(f"Checking {gradle_file}...")
              with open(gradle_file, 'r') as f:
                  content = f.read()
              # Remove any broken subprojects block with Groovy syntax in .kts files
              if 'sub.android.compileSdkVersion' in content or 'compileSdkVersion' in content:
                  content = re.sub(
                      r'\n*subprojects\s*\{[^}]*\}\s*',
                      '',
                      content,
                      flags=re.DOTALL
                  )
                  with open(gradle_file, 'w') as f:
                      f.write(content)
                  print(f"Cleaned subprojects block from {gradle_file}")
              else:
                  print(f"Root file OK, no changes needed")

          # 2b. Patch settings.gradle.kts AGP version for Gradle 8.11.1 compatibility
          # AGP 8.9.0+ requires Gradle 8.11.1+, so we cap AGP at 8.9.0
          for settings_file in glob.glob("android/settings.gradle*"):
              print(f"Checking AGP version in {settings_file}...")
              with open(settings_file, 'r') as f:
                  content = f.read()
              # Find AGP version and ensure it's <= 8.9.0 for Gradle 8.11.1 compat
              agp_match = re.search(r'com\.android\.application.*?version\s*["\']?(\d+\.\d+\.\d+)', content)
              if agp_match:
                  agp_version = agp_match.group(1)
                  major, minor, patch = map(int, agp_version.split('.'))
                  print(f"Found AGP version: {agp_version}")
                  if major > 8 or (major == 8 and minor > 9):
                      # Cap at 8.9.0 for Gradle 8.11.1 compatibility
                      new_version = "8.9.0"
                      content = content.replace(agp_version, new_version)
                      with open(settings_file, 'w') as f:
                          f.write(content)
                      print(f"Downgraded AGP from {agp_version} to {new_version} in {settings_file}")
                  else:
                      print(f"AGP version {agp_version} is compatible with Gradle 8.11.1")
              else:
                  print(f"No AGP version found in {settings_file}")

          # 3. Patch ALL cached plugin build.gradle files for compileSdk and namespace
          pub_cache = os.path.expanduser("~/.pub-cache")
          patched_count = 0
          for root, dirs, files in os.walk(pub_cache):
              for fname in files:
                  if fname.startswith("build.gradle"):
                      fpath = os.path.join(root, fname)
                      try:
                          with open(fpath, 'r') as f:
                              plugin_content = f.read()

                          changed = False

                          # Upgrade compileSdk to 36
                          if is_kts(fpath):
                              new_content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', plugin_content)
                          else:
                              new_content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', plugin_content)
                          if new_content != plugin_content:
                              plugin_content = new_content
                              changed = True

                          # Also force compileSdkVersion style
                          new_content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', plugin_content)
                          if new_content != plugin_content:
                              plugin_content = new_content
                              changed = True

                          # Add namespace if missing (AGP 8+ requirement)
                          if 'namespace' not in plugin_content:
                              manifest_dir = os.path.join(os.path.dirname(fpath), 'src', 'main')
                              manifest_path = os.path.join(manifest_dir, 'AndroidManifest.xml')
                              # Try finding manifest in various locations
                              if not os.path.exists(manifest_path):
                                  for search_root, _, search_files in os.walk(os.path.dirname(fpath)):
                                      if 'AndroidManifest.xml' in search_files:
                                          manifest_path = os.path.join(search_root, 'AndroidManifest.xml')
                                          break

                              if os.path.exists(manifest_path):
                                  with open(manifest_path, 'r') as mf:
                                      manifest_content = mf.read()
                                  pkg_match = re.search(r'package="([^"]+)"', manifest_content)
                                  if pkg_match:
                                      package_name = pkg_match.group(1)
                                      plugin_content = plugin_content.replace(
                                          'android {',
                                          f"android {{\n    namespace '{package_name}'"
                                      )
                                      changed = True
                                      print(f"Added namespace '{package_name}' to {fpath}")

                          if changed:
                              with open(fpath, 'w') as f:
                                  f.write(plugin_content)
                              patched_count += 1
                              print(f"Patched {fpath}")
                      except Exception as e:
                          print(f"Error patching {fpath}: {e}")

          print(f"Patched {patched_count} plugin build files")
          print("=== All Python patches complete ===")
          PYEOF

      - name: Build APK
        script: flutter build apk --debug

    artifacts:
      - build/**/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

      - name: Create guest_home_screen.dart for Rider App
        script: |
          cat > lib/screens/guest_home_screen.dart << 'DARTEOF'
          import 'package:flutter/material.dart';
          import '../utils/demo_mode.dart';
          import '../config/app_config.dart';

          class GuestHomeScreen extends StatefulWidget {
            const GuestHomeScreen({Key? key}) : super(key: key);
            @override
            State<GuestHomeScreen> createState() => _GuestHomeScreenState();
          }

          class _GuestHomeScreenState extends State<GuestHomeScreen> with SingleTickerProviderStateMixin {
            int _currentIndex = 0;
            bool _isOnline = false;
            late TabController _earningsTabController;

            @override
            void initState() {
              super.initState();
              _earningsTabController = TabController(length: 3, vsync: this);
            }

            @override
            void dispose() {
              _earningsTabController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: IndexedStack(
                  index: _currentIndex,
                  children: [
                    _buildHomeTab(),
                    _buildEarningsTab(),
                    _buildProfileTab(),
                  ],
                ),
                bottomNavigationBar: _buildBottomNav(),
              );
            }

            // ======== DEMO BANNER ========
            Widget _buildDemoBanner() {
              return Container(
                padding: EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                decoration: BoxDecoration(
                  color: Colors.orange.shade700,
                  borderRadius: BorderRadius.circular(10),
                ),
                child: Row(
                  children: [
                    Icon(Icons.wifi_off, color: Colors.white, size: 16),
                    SizedBox(width: 8),
                    Expanded(
                      child: Text('Demo Mode - Server Unavailable',
                        style: TextStyle(color: Colors.white, fontSize: 13, fontWeight: FontWeight.w600)),
                    ),
                  ],
                ),
              );
            }

            // ======== HOME TAB ========
            Widget _buildHomeTab() {
              final orders = DemoMode.getDemoActiveOrders();
              return SafeArea(
                child: Column(
                  children: [
                    _buildHeader(),
                    Expanded(
                      child: RefreshIndicator(
                        onRefresh: () async => setState(() {}),
                        color: Color(AppConfig.PRIMARY_COLOR),
                        child: CustomScrollView(
                          slivers: [

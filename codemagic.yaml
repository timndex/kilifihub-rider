workflows:
  android-apk:
    name: KilifiHub Rider Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Show directory structure
        script: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in current directory ==="
          ls -la
          echo "=== All folders (depth 2) ==="
          find . -maxdepth 2 -type d | head -50
          echo "=== Looking for pubspec.yaml ==="
          find . -name "pubspec.yaml" 2>/dev/null
          echo "=== Looking for android folder ==="
          find . -name "android" -type d 2>/dev/null
          echo "=== Looking for settings.gradle ==="
          find . -name "settings.gradle" 2>/dev/null

      - name: Navigate to project and fix Gradle files
        script: |
          # Find where pubspec.yaml is - that's our project root
          PUBSPEC_DIR=$(find . -name "pubspec.yaml" -not -path "./.git/*" | head -1 | xargs dirname)
          echo "Found pubspec.yaml in: $PUBSPEC_DIR"
          cd "$PUBSPEC_DIR"
          echo "Working from: $(pwd)"

          # Fix settings.gradle
          cat > android/settings.gradle << 'SETTINGSEOF'
          pluginManagement {
              def flutterSdkPath = null

              def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
              if (localPropertiesFile.exists()) {
                  def properties = new Properties()
                  localPropertiesFile.withInputStream { properties.load(it) }
                  flutterSdkPath = properties.getProperty("flutter.sdk")
              }

              if (flutterSdkPath == null) {
                  flutterSdkPath = System.env.FLUTTER_ROOT ?: '/Users/builder/programs/flutter'
              }

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.10" apply false
          }

          include ":app"
          SETTINGSEOF

          # Fix root build.gradle
          cat > android/build.gradle << 'BUILDEOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          BUILDEOF

          # Fix app build.gradle
          cat > android/app/build.gradle << 'APPBUILDEOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }

          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }

          android {
              namespace "com.kilifihub.rider"
              compileSdk 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId "com.kilifihub.rider"
                  minSdk 23
                  targetSdk 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                  }
              }
          }

          flutter {
              source '../..'
          }

          dependencies {
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          APPBUILDEOF

          # Fix Gradle wrapper
          sed -i '' 's|gradle-8.3-all.zip|gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties

          echo "=== All Gradle files fixed ==="

      - name: Get Flutter packages
        script: |
          PUBSPEC_DIR=$(find . -name "pubspec.yaml" -not -path "./.git/*" | head -1 | xargs dirname)
          cd "$PUBSPEC_DIR"
          flutter pub get

      - name: Build APK
        script: |
          PUBSPEC_DIR=$(find . -name "pubspec.yaml" -not -path "./.git/*" | head -1 | xargs dirname)
          cd "$PUBSPEC_DIR"
          flutter build apk --debug

    artifacts:
      - build/**/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

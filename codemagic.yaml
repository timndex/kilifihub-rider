workflows:
  android-apk:
    name: KilifiHub Rider Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Create fresh Flutter project and copy our code
        script: |
          # Use 'rider' as project name to align with your namespace exactly
          flutter create --org com.kilifihub --project-name rider /tmp/fresh_project
          
          cp -r lib/ /tmp/fresh_project/lib/
          cp pubspec.yaml /tmp/fresh_project/pubspec.yaml
          if [ -d "assets" ]; then
            cp -r assets/ /tmp/fresh_project/assets/
          fi

          # Write AndroidManifest.xml with correct permissions and package
          cat > /tmp/fresh_project/android/app/src/main/AndroidManifest.xml << 'MANIFESTEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:label="KilifiHub Rider"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          MANIFESTEOF

          rm -rf /Users/builder/clone/*
          cp -r /tmp/fresh_project/* /Users/builder/clone/
          cp -r /tmp/fresh_project/.* /Users/builder/clone/ 2>/dev/null || true

          # FIX: Manually ensure the Kotlin directory matches the package name exactly
          KOTLIN_PATH="/Users/builder/clone/android/app/src/main/kotlin/com/kilifihub/rider"
          mkdir -p "$KOTLIN_PATH"
          cat > "$KOTLIN_PATH/MainActivity.kt" << 'KOTLINEOF'
          package com.kilifihub.rider
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity() {
          }
          KOTLINEOF
          echo "=== Fresh project and MainActivity setup complete ==="

      - name: Replace Kotlin DSL with Groovy DSL and setup Gradle
        script: |
          ANDROID_DIR="/Users/builder/clone/android"

          # Opt out of Built-in Kotlin to suppress warnings and bypass strict AGP checks
          echo "android.builtInKotlin=false" >> "$ANDROID_DIR/gradle.properties"
          echo "android.newDsl=false" >> "$ANDROID_DIR/gradle.properties"

          # 1. settings.gradle: Include SDK path to fix "Plugin not found" errors
          rm -f "$ANDROID_DIR/settings.gradle.kts"
          cat > "$ANDROID_DIR/settings.gradle" << 'SETTINGSEOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }
              settings.ext.flutterSdkPath = flutterSdkPath()
              includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "com.android.application" version "8.11.1" apply false
              id "org.jetbrains.kotlin.android" version "2.2.20" apply false
              id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
          }
          include ":app"
          SETTINGSEOF

          # 2. root build.gradle with updated AGP and Kotlin versions
          rm -f "$ANDROID_DIR/build.gradle.kts"
          cat > "$ANDROID_DIR/build.gradle" << 'ROOTBUILDEOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.11.1"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          ROOTBUILDEOF

          # 3. app/build.gradle with explicit resource shrinking fix
          rm -f "$ANDROID_DIR/app/build.gradle.kts"
          cat > "$ANDROID_DIR/app/build.gradle" << 'APPBUILDEOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "com.kilifihub.rider"
              compileSdk 35
              defaultConfig {
                  applicationId "com.kilifihub.rider"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          APPBUILDEOF

          # 4. Update Gradle Wrapper to 8.14.0 for compatibility with AGP 8.11.1
          GRADLE_PROPS="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          sed -i '' 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-8.14-all.zip|' "$GRADLE_PROPS"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Fix missing namespaces and compileSdk in cached plugins
        script: |
          echo "Fixing plugin build files..."
          for BUILD_FILE in $(find ~/.pub-cache -name "build.gradle" -path "*/android/build.gradle"); do
            if ! grep -q "namespace" "$BUILD_FILE"; then
              MANIFEST=$(find "$(dirname "$BUILD_FILE")" -name "AndroidManifest.xml" | head -1)
              if [ -f "$MANIFEST" ]; then
                PACKAGE=$(grep -o 'package="[^"]*"' "$MANIFEST" | head -1 | sed 's/package="//;s/"//')
                if [ -n "$PACKAGE" ]; then
                  sed -i '' "s/^android {/android {\n    namespace '$PACKAGE'/" "$BUILD_FILE"
                fi
              fi
            fi
            # Ensure plugins use compatible compileSdk
            sed -i '' "s/compileSdk [0-9]*/compileSdk 35/" "$BUILD_FILE" 2>/dev/null
            sed -i '' "s/compileSdkVersion [0-9]*/compileSdkVersion 35/" "$BUILD_FILE" 2>/dev/null
          done

      - name: Build APK
        script: flutter build apk --debug --android-skip-build-dependency-validation

    artifacts:
      - build/**/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
